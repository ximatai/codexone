# Separate TLS server. Preserve the public authority, including its explicit port.
location / {
    proxy_pass http://127.0.0.1:18081;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Real-IP "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_next_upstream off;
    proxy_intercept_errors off;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    client_body_timeout 10s;
    client_max_body_size 8k;
    gzip off;
    access_log off;

    # Public assets can be compressed without compressing authenticated responses.
    location ~ ^/assets/[A-Za-z0-9_.-]+\.(js|css)$ {
        proxy_pass http://127.0.0.1:18081;
        gzip on;
        gzip_types text/css text/javascript application/javascript;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_vary on;
    }
}

# Read-only, cookie-authenticated live overview. Do not expose on the data listener.
location = /api/overview/live {
    proxy_pass http://127.0.0.1:18081;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Real-IP "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_next_upstream off;
    proxy_intercept_errors off;
    proxy_read_timeout 60s;
    proxy_send_timeout 5s;
    client_body_timeout 10s;
    client_max_body_size 8k;
    gzip off;
    access_log off;
}
