# Include inside the data TLS server. Define $codexone_connection in http {}.
location ~ ^/(v1|backend-api/codex)/ {
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $codexone_connection;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Real-IP "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_ignore_client_abort off;
    proxy_next_upstream off;
    proxy_intercept_errors off;
    gzip off;
    # Above the gateway execution maximum (1800s) so the gateway owns every deadline.
    proxy_read_timeout 1830s;
    proxy_send_timeout 1830s;
    client_body_timeout 30s;
    client_max_body_size 8m;
    access_log off;
}
# No management API, static assets or other routes on this server.
location / { return 404; }
