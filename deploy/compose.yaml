# Linux Docker Engine only: loopback listeners stay on the host's loopback network.
services:
  init-data:
    image: ${CODEXONE_IMAGE:?Set an immutable candidate image reference}
    platform: linux/amd64
    user: "0:0"
    working_dir: /
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    pids_limit: 16
    mem_limit: 32m
    restart: "no"
    healthcheck:
      disable: true
    volumes:
      - type: volume
        source: data
        target: /var/lib/codexone
        volume:
          nocopy: true
    environment:
      TARGET_UID: ${CODEXONE_UID:?Run init-install.py}
      TARGET_GID: ${CODEXONE_GID:?Run init-install.py}
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        for identifier in "$$TARGET_UID" "$$TARGET_GID"; do
          case "$$identifier" in ''|*[!0-9]*) exit 1 ;; esac
          [ "$$identifier" -gt 0 ] || exit 1
          [ "$$identifier" -le 2147483647 ] || exit 1
        done
        expected="$$TARGET_UID:$$TARGET_GID"
        actual="$$(stat -c %u:%g /var/lib/codexone)"
        if [ "$$actual" != "$$expected" ]; then
          entries="$$(find /var/lib/codexone -mindepth 1 -maxdepth 1 -print -quit)"
          if [ -n "$$entries" ]; then
            echo 'Existing data volume ownership differs; offline maintenance is required.' >&2
            exit 1
          fi
          chown "$$expected" /var/lib/codexone
        fi
        chmod 700 /var/lib/codexone
  gateway:
    image: ${CODEXONE_IMAGE:?Set an immutable candidate image reference}
    platform: linux/amd64
    network_mode: host
    user: "${CODEXONE_UID:?Run init-install.py}:${CODEXONE_GID:?Run init-install.py}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    volumes:
      - type: volume
        source: data
        target: /var/lib/codexone
        volume:
          nocopy: true
      - ./secrets:/run/codexone:ro
    environment:
      CODEXONE_ACCOUNT_POOL_CONFIG: /run/codexone/pool.json
      CODEXONE_ACCOUNT_MASTER_KEY_FILE: /run/codexone/master
      CODEXONE_ADMIN_TOKEN_FILE: /run/codexone/admin
      CODEXONE_ADMIN_PUBLIC_ORIGIN: ${CODEXONE_ADMIN_PUBLIC_ORIGIN:?Set the exact HTTPS management origin}
    restart: "no"
    stop_grace_period: 30s
    depends_on:
      init-data:
        condition: service_completed_successfully
volumes:
  data:
    driver: local
    name: ${CODEXONE_DATA_VOLUME:?Run init-install.py}
