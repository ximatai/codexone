name: Feature request
description: Discuss a focused improvement for personal self-hosting
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Describe your own-device/tool workflow using synthetic examples.
        Do not submit credentials, private deployment details, real content, or raw logs.
        Security concerns belong in Security → Report a vulnerability.
  - type: textarea
    id: problem
    attributes:
      label: Problem and desired result
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope and alternatives
      description: Include compatibility, privacy, usage, and recovery implications
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: How could this be verified with synthetic data?
