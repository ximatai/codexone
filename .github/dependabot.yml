version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      mantine:
        patterns: ['@mantine/*']
      testing:
        patterns: ['@testing-library/*', '@vitest/*', vitest, '@playwright/*', playwright, playwright-core]
      react:
        patterns: [react, react-dom, '@types/react', '@types/react-dom']
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
