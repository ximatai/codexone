name: Linux candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify optimized Linux binary with synthetic socket failures
        run: docker build --platform linux/amd64 --target verification -f deploy/Dockerfile -t codexone:tls-base .
      - name: Build from locked source
        run: docker build --platform linux/amd64 --build-arg SOURCE_REVISION="$GITHUB_SHA" -f deploy/Dockerfile -t codexone:candidate .
      - name: Verify real local TLS reverse proxy
        run: |
          docker build --platform linux/amd64 -f deploy/tls-verification.Dockerfile -t codexone:tls-verification .
          docker run --rm --platform linux/amd64 --network none --read-only --user 10001:10001 \
            --cap-drop ALL --security-opt no-new-privileges:true --pids-limit 128 --memory 768m \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777 --env PYTHONDONTWRITEBYTECODE=1 \
            --mount "type=bind,src=$PWD/scripts,dst=/test/scripts,readonly" \
            --mount "type=bind,src=$PWD/deploy,dst=/test/deploy,readonly" \
            codexone:tls-verification /test/scripts/verify_tls_proxy.py --binary /output/codexone
      - name: Build the distinct compatible v8 rollback peer
        run: |
          baseline=06058077d2cfa988f094ff50265202cd0721f919
          git fetch --no-tags origin "$baseline"
          mkdir "$RUNNER_TEMP/rollback-source"
          git archive "$baseline" | tar -x -C "$RUNNER_TEMP/rollback-source"
          # Product sources remain at the old revision; use the bounded current build manifest.
          cp Package.swift "$RUNNER_TEMP/rollback-source/Package.swift"
          docker build --platform linux/amd64 --build-arg SOURCE_REVISION="$baseline" \
            -f deploy/Dockerfile -t codexone:rollback-peer "$RUNNER_TEMP/rollback-source"
      - name: Verify actual private installation and compatible rollback
        run: python3 scripts/verify_installation.py --image codexone:candidate --previous-image codexone:rollback-peer
      - name: Export candidate and checksum
        run: |
          mkdir artifacts
          git archive --format=tar.gz --output=artifacts/source.tar.gz HEAD
          docker image inspect codexone:candidate --format '{{.Id}}' > artifacts/image-id.txt
          printf '%s\n' "$GITHUB_SHA" > artifacts/source-revision.txt
          docker run --rm --platform linux/amd64 --network none --read-only --cap-drop ALL \
            --entrypoint sha256sum codexone:candidate /usr/local/bin/codexone > artifacts/binary-sha256.txt
          docker save codexone:candidate | gzip > artifacts/codexone-linux-amd64.tar.gz
          cd artifacts
          sha256sum codexone-linux-amd64.tar.gz source.tar.gz image-id.txt source-revision.txt binary-sha256.txt > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codexone-linux-amd64-${{ github.sha }}
          path: artifacts/
          retention-days: 7
