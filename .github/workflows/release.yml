name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, commit or tag to verify (dry-run only)'
        required: true
        default: main
        type: string
      build_cache:
        description: 'Reuse optimized build layers (disable for a cold-build measurement)'
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      revision: ${{ steps.metadata.outputs.revision }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      image_archive_sha256: ${{ steps.export.outputs.image_archive_sha256 }}
      binaries_archive_sha256: ${{ steps.export.outputs.binaries_archive_sha256 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release policy and extract CHANGELOG
        id: metadata
        env:
          EVENT: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          args=()
          if [[ "$EVENT" == push ]]; then
            args+=(--tag "$PUSH_TAG")
          else
            args+=(--dry-run)
            if [[ "$INPUT_REF" == refs/tags/* ]]; then
              args+=(--tag "${INPUT_REF#refs/tags/}")
            elif git show-ref --verify --quiet "refs/tags/$INPUT_REF"; then
              args+=(--tag "$INPUT_REF")
            fi
          fi
          python3 scripts/test_prepare_release.py
          python3 scripts/test_check_ci.py
          python3 scripts/prepare_release.py "${args[@]}" --output-dir artifacts --github-output "$GITHUB_OUTPUT"
          python3 scripts/check_docs.py
          python3 scripts/check_ci.py
      # This namespace is separate from PR debug .build caches. No verification results are cached.
      - name: Restore optimized BuildKit layers
        if: github.event_name == 'push' || inputs.build_cache
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/release-buildkit
          key: ${{ runner.os }}-release-buildkit-v1-${{ hashFiles('deploy/Dockerfile', '.github/workflows/release.yml') }}-${{ steps.metadata.outputs.revision }}
          restore-keys: |
            ${{ runner.os }}-release-buildkit-v1-${{ hashFiles('deploy/Dockerfile', '.github/workflows/release.yml') }}-
      - name: Build optimized executables and runtime once
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          REVISION: ${{ steps.metadata.outputs.revision }}
          USE_BUILD_CACHE: ${{ github.event_name == 'push' || inputs.build_cache }}
          CACHE_HIT: ${{ steps.build-cache.outputs.cache-hit }}
        run: |
          docker buildx create --name codexone-release --driver docker-container \
            --driver-opt image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
          trap 'docker buildx rm --force codexone-release >/dev/null 2>&1 || true' EXIT
          cache_from=()
          optimized_cache_to=()
          runtime_cache_to=()
          if [[ "$USE_BUILD_CACHE" == true ]]; then
            for target in optimized runtime; do
              if [[ -f "$RUNNER_TEMP/release-buildkit/$target/index.json" ]]; then
                cache_from+=(--cache-from "type=local,src=$RUNNER_TEMP/release-buildkit/$target")
              fi
            done
            if [[ "$CACHE_HIT" != true ]]; then
              optimized_cache_to+=(--cache-to "type=local,dest=$RUNNER_TEMP/release-buildkit-next/optimized,mode=max,ignore-error=true")
              runtime_cache_to+=(--cache-to "type=local,dest=$RUNNER_TEMP/release-buildkit-next/runtime,mode=max,ignore-error=true")
            fi
          fi
          # Export only executables, never verification RUN layers or the SDK image.
          docker buildx build --builder codexone-release --platform linux/amd64 --progress plain \
            "${cache_from[@]}" "${optimized_cache_to[@]}" --target verification-export \
            --build-arg BUILD_JOBS=2 --output type=local,dest=optimized-output -f deploy/Dockerfile .
          docker buildx build --builder codexone-release --platform linux/amd64 --progress plain \
            "${cache_from[@]}" "${runtime_cache_to[@]}" --load --provenance=false \
            --build-arg BUILD_JOBS=2 --build-arg SOURCE_REVISION="$REVISION" \
            --build-arg VERSION="$VERSION" -f deploy/Dockerfile -t codexone:candidate .
      - name: Check candidate platform and source labels
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          REVISION: ${{ steps.metadata.outputs.revision }}
        run: |
          docker image inspect codexone:candidate --format '{{.Id}}' > artifacts/image-id.txt
          test "$(docker image inspect codexone:candidate --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          test "$(docker image inspect codexone:candidate --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$REVISION"
          test "$(docker image inspect codexone:candidate --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$VERSION"
      - name: Export candidate image, optimized binaries, source and licenses
        id: export
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          image_id="$(cat artifacts/image-id.txt)"
          test "$(docker image inspect codexone:candidate --format '{{.Id}}')" = "$image_id"
          git archive --format=tar.gz --prefix="codexone-$VERSION/" --output="artifacts/codexone-$VERSION-source.tar.gz" HEAD
          container="$(docker create "$image_id")"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          mkdir binaries
          docker cp "$container:/usr/local/bin/codexone" binaries/codexone
          cp optimized-output/ExecutionProbe binaries/ExecutionProbe
          cmp binaries/codexone optimized-output/codexone
          # Publish only the digest: the executable needs the image's Swift runtime.
          sha256sum binaries/codexone | sed 's|binaries/codexone|codexone-linux-amd64|' > artifacts/binary-sha256.txt
          tar -czf binaries/backend-binaries.tar.gz -C binaries codexone ExecutionProbe
          printf 'binaries_archive_sha256=%s\n' "$(sha256sum binaries/backend-binaries.tar.gz | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          mkdir "$RUNNER_TEMP/licenses"
          docker cp "$container:/opt/codexone/licenses/." "$RUNNER_TEMP/licenses/"
          docker cp "$container:/opt/codexone/LICENSE" "$RUNNER_TEMP/licenses/LICENSE"
          cp THIRD_PARTY_NOTICES.md "$RUNNER_TEMP/licenses/"
          tar -czf artifacts/licenses.tar.gz -C "$RUNNER_TEMP/licenses" .
          printf 'Not published; local image ID: %s\n' "$image_id" > artifacts/image-digest.txt
          mkdir image
          docker save "$image_id" | gzip > image/codexone-linux-amd64.tar.gz
          (cd image && sha256sum codexone-linux-amd64.tar.gz) > artifacts/image-archive-sha256.txt
          printf 'image_archive_sha256=%s\n' "$(cut -d ' ' -f 1 artifacts/image-archive-sha256.txt)" >> "$GITHUB_OUTPUT"
          (cd artifacts && sha256sum -- * > SHA256SUMS)
      - name: Keep only the current build's exported cache graphs
        if: (github.event_name == 'push' || inputs.build_cache) && steps.build-cache.outputs.cache-hit != 'true'
        id: cache-export
        run: |
          if [[ -f "$RUNNER_TEMP/release-buildkit-next/optimized/index.json" && -f "$RUNNER_TEMP/release-buildkit-next/runtime/index.json" ]]; then
            rm -rf "$RUNNER_TEMP/release-buildkit"
            mv "$RUNNER_TEMP/release-buildkit-next" "$RUNNER_TEMP/release-buildkit"
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Save optimized build layers without verification results
        if: steps.cache-export.outputs.ready == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/release-buildkit
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          include-hidden-files: false
          name: candidate-release-files
          path: artifacts/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          include-hidden-files: false
          name: candidate-linux-amd64-image
          path: image/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          include-hidden-files: false
          name: optimized-backend-binaries
          path: binaries/backend-binaries.tar.gz
          if-no-files-found: error
          retention-days: 1
  backend-scripts:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          name: optimized-backend-binaries
          path: binaries
      - name: Restore the candidate's optimized executables
        env:
          BINARIES_ARCHIVE_SHA256: ${{ needs.build.outputs.binaries_archive_sha256 }}
        run: |
          printf '%s  binaries/backend-binaries.tar.gz\n' "$BINARIES_ARCHIVE_SHA256" | sha256sum --check -
          tar -xzf binaries/backend-binaries.tar.gz -C binaries
      - name: Build verification tools without compiling the product
        run: docker build --platform linux/amd64 --target verification-tools -f deploy/Dockerfile -t codexone:verification-tools .
      - name: Verify optimized protocol and lifecycle shard without external network
        run: |
          docker run --rm --platform linux/amd64 --network none \
            --env PYTHONDONTWRITEBYTECODE=1 --env CODEXONE_BACKEND_BIN_DIR=/binaries \
            --mount "type=bind,src=$PWD,dst=/build,readonly" \
            --mount "type=bind,src=$PWD/binaries,dst=/binaries,readonly" \
            codexone:verification-tools bash scripts/verify.sh --backend-scripts '${{ matrix.shard }}'
  image-checks:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [tls, installation]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          name: candidate-release-files
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          name: candidate-linux-amd64-image
          path: image
      - name: Restore the exact candidate image
        env:
          IMAGE_ARCHIVE_SHA256: ${{ needs.build.outputs.image_archive_sha256 }}
        run: |
          (cd artifacts && sha256sum --check SHA256SUMS)
          (cd image && sha256sum --check ../artifacts/image-archive-sha256.txt)
          printf '%s  image/codexone-linux-amd64.tar.gz\n' "$IMAGE_ARCHIVE_SHA256" | sha256sum --check -
          docker load --input image/codexone-linux-amd64.tar.gz
          image_id="$(cat artifacts/image-id.txt)"
          test "$(docker image inspect "$image_id" --format '{{.Id}}')" = "$image_id"
          test "$(docker image inspect "$image_id" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          docker tag "$image_id" codexone:candidate
      - name: Verify real local TLS reverse proxy with the candidate binary and SPA
        if: matrix.suite == 'tls'
        run: |
          docker build --platform linux/amd64 -f deploy/tls-verification.Dockerfile -t codexone:tls-verification .
          docker run --rm --platform linux/amd64 --network none --read-only --user 10001:10001 \
            --cap-drop ALL --security-opt no-new-privileges:true --pids-limit 128 --memory 768m \
            --tmpfs /tmp:rw,noexec,nosuid,size=512m,mode=1777 --env PYTHONDONTWRITEBYTECODE=1 \
            --mount "type=bind,src=$PWD/scripts,dst=/test/scripts,readonly" \
            --mount "type=bind,src=$PWD/deploy,dst=/test/deploy,readonly" \
            codexone:tls-verification /test/scripts/verify_tls_proxy.py --binary /output/codexone
      - name: Verify actual private installation
        if: matrix.suite == 'installation'
        run: python3 scripts/verify_installation.py --image "$(cat artifacts/image-id.txt)"
  verify:
    if: always()
    needs: [build, backend-scripts, image-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ needs.build.outputs.version }}
      tag: ${{ needs.build.outputs.tag }}
      revision: ${{ needs.build.outputs.revision }}
      prerelease: ${{ needs.build.outputs.prerelease }}
      image_archive_sha256: ${{ needs.build.outputs.image_archive_sha256 }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Require every optimized binary and image check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY_GATE'
          import json, os
          for job, details in json.loads(os.environ['RESULTS']).items():
              result = details['result']
              print(f'{job}: {result}')
              if result != 'success':
                  raise SystemExit(f'{job} did not succeed')
          PY_GATE
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          name: candidate-release-files
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          name: candidate-linux-amd64-image
          path: image
      - name: Bind verified artifacts to the build's exact image archive hash
        env:
          IMAGE_ARCHIVE_SHA256: ${{ needs.build.outputs.image_archive_sha256 }}
        run: |
          (cd artifacts && sha256sum --check SHA256SUMS)
          (cd image && sha256sum --check ../artifacts/image-archive-sha256.txt)
          printf '%s  image/codexone-linux-amd64.tar.gz\n' "$IMAGE_ARCHIVE_SHA256" | sha256sum --check -
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          include-hidden-files: false
          name: verified-release-files
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          include-hidden-files: false
          name: verified-linux-amd64-image
          path: image/
          if-no-files-found: error
          retention-days: 7
  publish:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    defaults:
      run:
        shell: bash
    env:
      IMAGE: ghcr.io/ximatai/codexone
      VERSION: ${{ needs.verify.outputs.version }}
      IMAGE_ARCHIVE_SHA256: ${{ needs.verify.outputs.image_archive_sha256 }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          name: verified-release-files
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          name: verified-linux-amd64-image
          path: image
      - name: Restore exactly the verified image
        run: |
          (cd artifacts && sha256sum --check SHA256SUMS)
          (cd image && sha256sum --check ../artifacts/image-archive-sha256.txt)
          printf '%s  image/codexone-linux-amd64.tar.gz\n' "$IMAGE_ARCHIVE_SHA256" | sha256sum --check -
          docker load --input image/codexone-linux-amd64.tar.gz
          image_id="$(cat artifacts/image-id.txt)"
          test "$(docker image inspect "$image_id" --format '{{.Id}}')" = "$image_id"
          test "$(docker image inspect "$image_id" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          docker tag "$image_id" "$IMAGE:$VERSION"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push verified image and check registry digest and image ID
        id: push
        run: |
          docker push "$IMAGE:$VERSION" | tee "$RUNNER_TEMP/push.log"
          digest="$(sed -nE 's/^.*: digest: (sha256:[0-9a-f]{64}) size: [0-9]+$/\1/p' "$RUNNER_TEMP/push.log")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull --platform linux/amd64 "$IMAGE@$digest"
          test "$(docker image inspect "$IMAGE@$digest" --format '{{.Id}}')" = "$(cat artifacts/image-id.txt)"
          printf '%s\n' "$digest" > artifacts/image-digest.txt
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Attest published image digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/ximatai/codexone
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # Organization storage records are separate from the image attestation.
          create-storage-record: false
      - name: Update latest for stable releases only
        if: needs.verify.outputs.prerelease == 'false'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker tag "$(cat artifacts/image-id.txt)" "$IMAGE:latest"
          docker push "$IMAGE:latest" | tee "$RUNNER_TEMP/latest.log"
          latest_digest="$(sed -nE 's/^.*: digest: (sha256:[0-9a-f]{64}) size: [0-9]+$/\1/p' "$RUNNER_TEMP/latest.log")"
          test "$latest_digest" = "$DIGEST"
      - name: Finalize release notes and checksums
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cat >> artifacts/release-notes.md <<EOF_NOTES

          ### 镜像（Linux amd64）

          Digest: \`$DIGEST\`

          \`\`\`sh
          docker pull $IMAGE:$VERSION
          docker pull $IMAGE@$DIGEST
          gh attestation verify oci://$IMAGE:$VERSION -R ximatai/codexone
          \`\`\`
          EOF_NOTES
          rm artifacts/SHA256SUMS
          (cd artifacts && sha256sum -- * > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          include-hidden-files: false
          name: published-release-files
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
  release:
    if: github.event_name == 'push'
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          name: published-release-files
          path: artifacts
      - name: Create GitHub Release with verified artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ximatai/codexone
          TAG: ${{ needs.verify.outputs.tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        shell: bash
        run: |
          (cd artifacts && sha256sum --check SHA256SUMS)
          args=(--latest)
          if [[ "$PRERELEASE" == true ]]; then args=(--prerelease --latest=false); fi
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file artifacts/release-notes.md "${args[@]}" \
            artifacts/*-source.tar.gz artifacts/licenses.tar.gz \
            artifacts/SHA256SUMS artifacts/image-digest.txt artifacts/image-id.txt \
            artifacts/binary-sha256.txt artifacts/source-revision.txt artifacts/release.json \
            artifacts/release-notes.md artifacts/image-archive-sha256.txt
