name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CODEXONE_CI_APT_MIRROR: https://mirrors.edge.kernel.org/ubuntu
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      storage: ${{ steps.filter.outputs.storage }}
      frontend: ${{ steps.filter.outputs.frontend }}
      devcontainer: ${{ steps.filter.outputs.devcontainer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks from changed paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            git diff --name-only -z --no-renames "$BASE...$HEAD" > "$RUNNER_TEMP/changed-paths"
            bash scripts/ci_changes.sh < "$RUNNER_TEMP/changed-paths" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT" == push ]] &&
            git diff --name-only -z --no-renames "$PUSH_BEFORE" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-paths" &&
            selection="$(bash scripts/ci_changes.sh < "$RUNNER_TEMP/changed-paths")" &&
            [[ "$(gh run list --repo "$GITHUB_REPOSITORY" --workflow verify.yml --branch main \
              --event push --commit "$PUSH_BEFORE" --status success --limit 1 \
              --json databaseId --jq 'length > 0')" == true ]]; then
            printf '%s\n' "$selection" >> "$GITHUB_OUTPUT"
          else
            bash scripts/ci_changes.sh --all >> "$GITHUB_OUTPUT"
          fi
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/check_docs.py
      - run: python3 scripts/backend_shards.py --check
      - run: python3 scripts/check_ci.py
      - run: python3 scripts/test_check_ci.py
  backend-rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.96.0
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Verify the independently locked Rust crates
        env:
          STORAGE_PRESSURE: ${{ needs.changes.outputs.storage }}
        run: |
          if [[ "$STORAGE_PRESSURE" == true ]]; then
            ./scripts/verify_rust.sh --with-storage-tmpfs ./scripts/verify_rust.sh --crate-tests
          else
            ./scripts/verify_rust.sh --crate-tests
          fi
  backend-rust-build:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.96.0
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Build and package the optimized Rust gateway
        run: |
          ./scripts/verify_rust.sh --release-build
          tar -czf "$RUNNER_TEMP/backend-rust-binaries.tar.gz" -C rust/gateway/target/release codexone
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          include-hidden-files: false
          name: backend-rust-binaries
          path: ${{ runner.temp }}/backend-rust-binaries.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Build the isolated Rust gateway probe
        if: needs.changes.outputs.rust == 'true'
        run: |
          ./scripts/verify_rust.sh --release-probe "$RUNNER_TEMP/probe/RustGatewayProbe"
          tar -czf "$RUNNER_TEMP/rust-gateway-probe.tar.gz" -C "$RUNNER_TEMP/probe" RustGatewayProbe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.rust == 'true'
        with:
          name: rust-gateway-probe
          path: ${{ runner.temp }}/rust-gateway-probe.tar.gz
          if-no-files-found: error
          retention-days: 1
  backend-rust-scripts:
    needs: [changes, backend-rust-build]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CODEXONE_BACKEND_BIN_DIR: ${{ github.workspace }}/.build/rust-verify
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          name: backend-rust-binaries
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          name: rust-gateway-probe
          path: ${{ runner.temp }}
      - name: Verify optimized Rust protocol and lifecycle shard
        shell: bash
        env:
          VERIFY_EVENT: ${{ github.event_name }}
          STORAGE_PRESSURE: ${{ needs.changes.outputs.storage }}
        run: |
          mkdir -p "$CODEXONE_BACKEND_BIN_DIR"
          tar -xzf "$RUNNER_TEMP/backend-rust-binaries.tar.gz" -C "$CODEXONE_BACKEND_BIN_DIR"
          tar -xzf "$RUNNER_TEMP/rust-gateway-probe.tar.gz" -C "$CODEXONE_BACKEND_BIN_DIR"
          args=()
          if [[ "$VERIFY_EVENT" == pull_request || "$VERIFY_EVENT" == push ]]; then
            args+=(--pr)
          fi
          runner=()
          if [[ "$STORAGE_PRESSURE" == true && '${{ matrix.shard }}' == '4/4' ]]; then
            runner+=(./scripts/verify_rust.sh --with-storage-tmpfs)
          fi
          "${runner[@]}" ./scripts/verify.sh --backend-scripts '${{ matrix.shard }}' "${args[@]}"
  frontend-live:
    needs: [changes, backend-rust-build]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --init --ipc=host
    timeout-minutes: 15
    env:
      CODEXONE_WEB_STUBS_ONLY: '0'
      CODEXONE_WEB_TEST_BINARY: ../.build/live/codexone
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          package-manager-cache: false
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          name: backend-rust-binaries
          path: ${{ runner.temp }}
      - name: Restore matching gateway
        run: |
          mkdir -p ../.build/live
          tar -xzf "$RUNNER_TEMP/backend-rust-binaries.tar.gz" -C ../.build/live
      - name: Verify frontend and build the shared SPA
        if: needs.changes.outputs.frontend == 'true'
        env:
          CODEXONE_WEB_STUBS_ONLY: '1'
        run: ../scripts/verify.sh --web
      - name: Build the SPA for Rust-only changes
        if: needs.changes.outputs.frontend != 'true'
        run: npm run build
      - name: Verify real gateway and browser together
        run: npm run test:e2e -- admin-live-real --workers=1
      - name: Upload real browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          include-hidden-files: false
          name: live-browser-failure-evidence
          path: web/test-results/
          retention-days: 7
  devcontainer:
    needs: changes
    if: needs.changes.outputs.devcontainer == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the development container
        run: docker build -t codexone-dev .devcontainer
      - name: Build backend and check frontend inside it
        run: >-
          docker run --rm -v "$PWD":/workspace -w /workspace codexone-dev bash -c
          'set -e; node --version; rustc --version; python3 --version;
          cargo build --locked --manifest-path rust/gateway/Cargo.toml --bin codexone;
          npm --prefix web ci --ignore-scripts --no-audit --no-fund;
          npm --prefix web run typecheck'
  verify:
    if: always()
    needs: [changes, docs, backend-rust, backend-rust-build, backend-rust-scripts, frontend-live, devcontainer]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require successful selected checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ['RESULTS'])
          selected = needs['changes'].get('outputs', {})
          for name in ('rust', 'storage', 'frontend', 'devcontainer'):
              if selected.get(name) not in ('true', 'false'):
                  raise SystemExit(f'Missing or invalid selection for {name}')
          required = {'changes', 'docs'}
          rust = selected['rust'] == 'true'
          frontend = selected['frontend'] == 'true'
          if selected['storage'] == 'true' and not rust:
              raise SystemExit('Storage validation requires Rust checks')
          if rust:
              required.update({'backend-rust', 'backend-rust-scripts'})
          if rust or frontend:
              required.update({'backend-rust-build', 'frontend-live'})
          if selected['devcontainer'] == 'true':
              required.add('devcontainer')
          if missing := required - needs.keys():
              raise SystemExit(f'Missing selected jobs: {sorted(missing)}')
          for job, details in needs.items():
              result = details['result']
              print(f'{job}: {result}')
              if result != 'success' and (job in required or result != 'skipped'):
                  raise SystemExit(f'{job} did not succeed')
          PY
