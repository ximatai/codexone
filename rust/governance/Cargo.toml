[package]
name = "codexone-governance"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
bytes = "1"
codexone-admin = { path = "../admin" }
codexone-config = { path = "../config" }
codexone-storage = { path = "../storage" }
codexone-wire = { path = "../wire" }
getrandom = "0.4"
http = "1"
percent-encoding = "2"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
unicode-general-category = "1"
unicode-normalization = "0.1"
uuid = { version = "1", default-features = false }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "sync", "test-util", "time"] }
