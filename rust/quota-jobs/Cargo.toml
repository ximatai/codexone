[package]
name = "codexone-quota-jobs"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
codexone-execution = { path = "../execution" }
codexone-governance = { path = "../governance" }
codexone-identity-runtime = { path = "../identity-runtime" }
codexone-http-upstream = { path = "../http-upstream" }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
unicode-general-category = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "net", "test-util"] }
base64 = "0.22"
codexone-storage = { path = "../storage" }
