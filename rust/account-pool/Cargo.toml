[package]
name = "codexone-account-pool"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rusqlite = { version = "0.43", features = ["bundled", "wal"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "sync", "time"] }

[dev-dependencies]
codexone-storage = { path = "../storage" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
