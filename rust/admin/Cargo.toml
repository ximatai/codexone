[package]
name = "codexone-admin"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
bytes = "1"
codexone-config = { path = "../config" }
codexone-wire = { path = "../wire" }
getrandom = "0.4"
http = "1"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", default-features = false }
zeroize = "1"
