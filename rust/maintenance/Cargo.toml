[package]
name = "codexone-maintenance"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
codexone-storage = { path = "../storage" }
hex = "0.4"
libc = "0.2"
rusqlite = { version = "0.43", features = ["backup", "bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
