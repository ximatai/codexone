[package]
name = "codexone-gateway"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "codexone"
path = "src/main.rs"

[dependencies]
async-stream = "0.3"
bytes = "1"
codexone-admin = { path = "../admin" }
codexone-config = { path = "../config" }
codexone-execution = { path = "../execution" }
codexone-governance = { path = "../governance" }
codexone-http-upstream = { path = "../http-upstream" }
codexone-maintenance = { path = "../maintenance" }
codexone-image-service = { path = "../image-service" }
codexone-images = { path = "../images" }
codexone-identity-runtime = { path = "../identity-runtime" }
codexone-responses = { path = "../responses" }
codexone-storage = { path = "../storage" }
codexone-wire = { path = "../wire" }
futures-util = "0.3"
hex = "0.4"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
percent-encoding = "2"
rusqlite = { version = "0.43", features = ["bundled"] }
self_cell = "1"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
base64 = "0.22"
tempfile = "3"
