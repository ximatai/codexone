[package]
name = "codexone-gateway"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "codexone"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
async-stream = "0.3"
aes-gcm = "0.10"
bytes = "1"
codexone-admin = { path = "../admin" }
codexone-config = { path = "../config" }
codexone-execution = { path = "../execution" }
codexone-governance = { path = "../governance" }
codexone-http-upstream = { path = "../http-upstream" }
codexone-maintenance = { path = "../maintenance" }
codexone-image-service = { path = "../image-service" }
codexone-images = { path = "../images" }
codexone-identity-runtime = { path = "../identity-runtime" }
codexone-quota-jobs = { path = "../quota-jobs" }
codexone-responses = { path = "../responses" }
codexone-storage = { path = "../storage" }
codexone-usage = { path = "../usage" }
codexone-websocket = { path = "../websocket" }
codexone-wire = { path = "../wire" }
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
percent-encoding = "2"
rusqlite = { version = "0.43", features = ["bundled"] }
self_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7", features = ["rt"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
zstd = { version = "0.13", default-features = false }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

[dev-dependencies]
tungstenite = "0.29"
base64 = "0.22"
codexone-maintenance = { path = "../maintenance", features = ["backup-test-support"] }
