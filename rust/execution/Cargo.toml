[package]
name = "codexone-execution"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
codexone-account-pool = { path = "../account-pool" }
codexone-storage = { path = "../storage" }
libc = "0.2"
rusqlite = { version = "0.43", features = ["bundled", "wal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
zeroize = "1"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
