[package]
name = "codexone-usage"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
bytes = "1"
http = "1"
percent-encoding = "2"
rusqlite = { version = "0.43", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
codexone-storage = { path = "../storage" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
